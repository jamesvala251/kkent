name: Deploy to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-hostinger.yml'

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        run: |
          cd frontend
          npm ci
          cd ..
          chmod +x deploy/build-production.sh
          ./deploy/build-production.sh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT || '65002' }}" "${{ secrets.HOSTINGER_SSH_HOST || '187.124.102.138' }}" >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger
        env:
          HOSTINGER_SSH: ${{ secrets.HOSTINGER_SSH_USER || 'u255158670' }}@${{ secrets.HOSTINGER_SSH_HOST || '187.124.102.138' }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          HOSTINGER_HOME: ${{ secrets.HOSTINGER_HOME || '/home/u255158670' }}
          HOSTINGER_SSH_KEY_FILE: ~/.ssh/hostinger_deploy
        run: |
          chmod +x deploy/upload-hostinger.sh
          ./deploy/upload-hostinger.sh all
